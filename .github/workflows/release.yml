name: Release

# Releases whenever main carries a version that has no tag yet. Bump the
# version and promote the changelog section in a PR; merging it publishes
# the package to PyPI, then tags the merge commit v<version> and creates the
# GitHub release with that changelog section as its notes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  check:
    name: Check for an unreleased version
    # workflow_dispatch can start a run from any branch; only main releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag and PyPI
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Exit code 2 means no matching ref; anything else non-zero is an
          # error, not a missing tag.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "v$VERSION is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" -eq 2 ]; then
            echo "v$VERSION is not tagged yet"
          else
            echo "::error::git ls-remote failed with exit code $status"
            exit "$status"
          fi

          # An untagged version that is already on PyPI means an earlier run
          # published it and then failed. Releasing again from this commit
          # would tag source that may differ from the files on PyPI.
          http=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/drippy-eda/$VERSION/json")
          if [ "$http" = 404 ]; then
            echo "$VERSION is not on PyPI yet, releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$http" = 200 ]; then
            echo "::error::drippy-eda $VERSION is on PyPI but v$VERSION is not tagged. Finish the run that published it with \"Re-run failed jobs\", or bump the version."
            exit 1
          else
            echo "::error::PyPI lookup for $VERSION returned HTTP $http"
            exit 1
          fi

  build:
    name: Build distribution
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v header="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, header) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md
      - name: Run the tests
        run: uv run --locked pytest
      - name: Build the package
        run: uv build
      - name: Check the distribution with twine
        run: uvx twine check dist/*
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          overwrite: true
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          overwrite: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drippy-eda
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a rerun get past this step if creating the GitHub release
          # failed after the upload succeeded.
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download release notes artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
      - name: Tag the commit and create the release
        run: |
          # A rerun after a partial failure finds the release already there;
          # upload the assets again instead of failing on create. Only a 404
          # means there is no release; any other API error fails the step.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --silent 2> lookup-error.txt; then
            gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif grep -q "HTTP 404" lookup-error.txt; then
            gh release create "v$VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes-file release-notes.md
          else
            cat lookup-error.txt
            exit 1
          fi
